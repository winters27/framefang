[package]
name = "framefang-core"
description = "Frame Fang's OS-free core: tools, annotations, settings, theme and editor state"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
bitflags = { version = "2", features = ["serde"] }
chrono.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Text annotations are drawn with the font compiled in from assets/fonts/,
# rasterized by fontdue, so they look the same on every OS and need no system
# font library. unicode-segmentation lets Backspace remove a whole visible
# character (an emoji, an accented letter), not one code point. Both are
# MIT OR Apache-2.0.
fontdue = { version = "0.9", features = ["std"], default-features = false }
unicode-segmentation = "1"
