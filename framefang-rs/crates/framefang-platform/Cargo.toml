[package]
name = "framefang-platform"
description = "Frame Fang's operating-system layer: screen capture, hotkeys, tray icon, clipboard and recording"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
framefang-core = { path = "../framefang-core" }
anyhow.workspace = true
arboard.workspace = true
chrono.workspace = true
global-hotkey.workspace = true
image.workspace = true
thiserror.workspace = true
tray-icon.workspace = true
xcap.workspace = true

# Every Unix: flock for the one-instance lock, and PR_SET_PDEATHSIG on Linux
# so a recorder child dies with us. Neither has a safe std wrapper.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux tray backend (StatusNotifierItem through libayatana-appindicator)
# runs on GTK: GTK has to be set up on the main thread before the first menu
# item exists, and its main loop has to be turned for clicks to arrive.
# `Tray::new` does the first and `Tray::pump_events` the second.
gtk = "0.18"
# Wayland gives a client neither a key grab nor a readable screen, so the
# hotkey (GlobalShortcuts), the capture fallback (Screenshot) and recording
# (ScreenCast) all go through xdg-desktop-portal. rfd already brings `ashpd`
# in for its file dialogs; using the same async-std flavour means one zbus
# runtime in the process. `pollster`, also already in the tree, runs those
# futures on our own threads so tokio never has to come in.
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pollster = "0.4"
# ScreenCast answers with a PipeWire node and ffmpeg can't read one, so the
# recorder pulls the frames itself (recorder_wayland.rs). xcap already
# depends on pipewire, so building needed libpipewire-0.3-dev before this
# line too: it is a direct edge, not a new requirement.
pipewire = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
# Sound for recordings (recorder_windows_audio.rs): the default playback
# device opened in loopback mode is "what you hear", the default capture
# device is the microphone, and neither needs Stereo Mix or a virtual cable.
# The samples reach ffmpeg over a socket on 127.0.0.1.
wasapi = "0.15"
windows = { version = "0.62", features = [
    # Shared by everything below.
    "Win32_Foundation",
    # A Job Object holds the recorder child so the kernel ends it when our
    # handle closes (child_guard.rs). SECURITY_ATTRIBUTES is in the
    # CreateJobObjectW signature, and IO_COUNTERS sits inside
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # The process list, to notice another tool that wants Print Screen
    # (processes.rs).
    "Win32_System_Diagnostics_ToolHelp",
    # The hotkeys' second route: raw keyboard input into a message-only
    # window (raw_keys.rs).
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Window frames and cloaking for the hover highlight (windows_list.rs),
    # and the pointer drawn into a capture (cursor.rs).
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # UI Automation finds the part of a window that scrolls, for SCROLL
    # mode's highlight (scroll_parts.rs).
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    # Windows.Media.Ocr reads text (ocr.rs): the engine, its bitmap, the
    # buffer that bitmap is filled from, and the language lists.
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Sound for recordings (recorder_macos_audio.rs): ScreenCaptureKit hands us
# the system mix with no BlackHole or Aggregate device. The PCM is taken out
# of each CMSampleBuffer and sent to ffmpeg over a 127.0.0.1 socket, the same
# way the Windows recorder does it.
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-audio-types = { version = "0.3", features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFData"] }
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "objc2-core-audio-types",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSError",
    "NSArray",
    "NSObjCRuntime",
    "NSDictionary",
] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCStream", "SCShareableContent", "SCError"] }
# Text recognition (ocr.rs): Vision's text request, run on a CGImage built
# from the picture's bytes.
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGColorSpace", "CGDataProvider"] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "VNRequest",
    "VNRecognizeTextRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNTypes",
    "objc2-core-graphics",
    "objc2-core-foundation",
] }
