# Frame Fang workspace: a core crate with no OS code, a platform crate that
# wraps each operating system, and the app that ties them into the tray app.
[workspace]
members = ["crates/framefang-app", "crates/framefang-core", "crates/framefang-platform"]
resolver = "2"

[workspace.package]
version = "1.7.0"
description = "Fast screenshots with annotations, native on Windows, macOS and Linux"
authors = ["winters27"]
repository = "https://github.com/winters27/framefang"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

# Versions every crate shares, so one bump here moves the whole workspace.
# Alphabetical; what each is for:
#   anyhow, thiserror      error types
#   arboard                clipboard
#   chrono                 timestamps in file names
#   directories            the per-user settings folder
#   global-hotkey          hotkeys on Windows, macOS and X11
#   image                  encoding and decoding saved pictures
#   rfd                    native file and folder pickers
#   serde, serde_json      settings.json
#   sha2                   the updater checks downloads against SHA256SUMS
#   softbuffer, tiny-skia  CPU drawing: tiny-skia rasterizes, softbuffer
#                          shows the pixels, so no GPU driver is involved
#   tray-icon              the tray icon and its menu
#   xcap                   screen capture
[workspace.dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["std", "clock"], default-features = false }
directories = "6"
global-hotkey = "0.7"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "webp"], default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
softbuffer = "0.4"
thiserror = "1"
tiny-skia = "0.11"
tray-icon = "0.23"
xcap = "0.9"

# Shipped builds: small, fast, no symbols, and a panic ends the process.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
